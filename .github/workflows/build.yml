name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write # for attaching the zip to a draft release on v* tags
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      # Only the submodules the build needs; vst3sdk's vstgui4, doc and tutorials are skipped.
      - name: Fetch submodules
        run: |
          git submodule update --init --depth 1 external/clap external/clap-wrapper external/vst3sdk
          git -C external/vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk cmake

      - name: Read version
        id: version
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(YeOldeVST VERSION ([0-9.]+)'
          if (-not $m) { throw "no version in CMakeLists.txt" }
          $v = $m.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "tag $env:GITHUB_REF_NAME does not match CMakeLists.txt version $v"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "YeOldeVST $v"

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test (headless CLAP host)
        timeout-minutes: 10
        run: |
          $PSNativeCommandUseErrorActionPreference = $false # exit codes are checked below
          # The VST2 path ends up in a state blob, so it must be absolute.
          $bin = Resolve-Path build/Release
          $bin32 = Resolve-Path build/host32/Release
          $test = "$bin/yov_clap_test.exe"
          $clap = "$bin/YeOldeVST.clap"
          $cases = @(
            @{ name = "instrument, 64-bit VST2";            args = @("render", "instrument", "$bin/YovTest64.dll") },
            @{ name = "instrument, 32-bit VST2 via bridge"; args = @("render", "instrument", "$bin32/YovTest32.dll") },
            @{ name = "multi-out, 64-bit VST2";             args = @("render", "multi", "$bin/YovTest64.dll") },
            # A plugin with far more outputs than YeOldeVST routes must not write past its buffers.
            @{ name = "128 outputs, 64-bit VST2";           args = @("render", "multi", "$bin/YovTest64.dll"); outputs = "128" },
            @{ name = "128 outputs, 32-bit VST2 via bridge"; args = @("render", "multi", "$bin32/YovTest32.dll"); outputs = "128" },
            # Settings as a bank chunk, whose loading selects the first program: the saved program must come back.
            @{ name = "chunks, 64-bit VST2";                args = @("render", "instrument", "$bin/YovTest64.dll"); chunks = "1" },
            @{ name = "chunks, 32-bit VST2 via bridge";     args = @("render", "instrument", "$bin32/YovTest32.dll"); chunks = "1" }
          )
          $failed = 0
          foreach ($c in $cases) {
            $env:YOV_TEST_OUTPUTS = $c.outputs  # read by the test plugin; empty = its default
            $env:YOV_TEST_CHUNKS = $c.chunks
            Write-Host "::group::$($c.name)"
            $out = & $test $clap @($c.args) | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            Write-Host "::endgroup::"
            $pass = $code -eq 0 -and $out -match '(?m)^PASS\s*$'
            Write-Host ("{0}: {1}" -f $c.name, $(if ($pass) { "PASS" } else { "FAIL (exit $code)" }))
            "| $($c.name) | $(if ($pass) { 'PASS' } else { 'FAIL' }) |" | Out-File $env:TEMP/results.md -Append
            if (-not $pass) { $failed++ }
          }
          "### Headless CLAP host`n`n| Case | Result |`n|---|---|" >> $env:GITHUB_STEP_SUMMARY
          Get-Content $env:TEMP/results.md >> $env:GITHUB_STEP_SUMMARY
          if ($failed) { throw "$failed test case(s) failed" }

      - name: Test MIDI pass-through (bend, sustain)
        timeout-minutes: 5
        run: |
          $PSNativeCommandUseErrorActionPreference = $false # exit codes are checked below
          $bin = Resolve-Path build/Release
          $bin32 = Resolve-Path build/host32/Release
          # Full bend up and sustain on must reach the VST2 unchanged; out-of-range data bytes
          # (a host scaling a full controller to 128) must arrive clamped to 127.
          $env:YOV_TEST_SEND = "E07F7F,B0407F,B04080"
          foreach ($dll in @("$bin/YovTest64.dll", "$bin32/YovTest32.dll")) {
            $log = "$env:TEMP/yov_midi.log"
            Remove-Item $log -ErrorAction SilentlyContinue
            $env:YOV_TEST_MIDI_LOG = $log
            & "$bin/yov_clap_test.exe" "$bin/YeOldeVST.clap" render instrument $dll | Out-Null
            $got = Get-Content $log -ErrorAction SilentlyContinue | Where-Object { $_ -match '^[BE]' }
            Write-Host "$dll`n$($got -join "`n")"
            if (-not ($got -match '^E0 7F 7F') -or -not ($got -match '^B0 40 7F') -or ($got -match ' 80 ')) {
              throw "MIDI did not reach $dll intact"
            }
          }

      - name: Test MIDI controllers through the VST3
        timeout-minutes: 5
        run: |
          $PSNativeCommandUseErrorActionPreference = $false # exit codes are checked below
          $bin = Resolve-Path build/Release
          $bin32 = Resolve-Path build/host32/Release
          # Every CC, aftertouch and bend on every channel, sent the VST3 way (IMidiMapping).
          $vst3 = "$bin/YeOldeVST.vst3/Contents/x86_64-win/YeOldeVST.vst3"
          foreach ($dll in @("$bin/YovTest64.dll", "$bin32/YovTest32.dll")) {
            $out = & "$bin/yov_vst3_midi_test.exe" $vst3 $dll | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            if ($code -ne 0 -or $out -notmatch '(?m)^PASS\s*$') { throw "VST3 MIDI controllers did not reach $dll intact" }
          }

      - name: Build Steinberg VST3 validator
        run: |
          cmake -S external/vst3sdk -B build-vst3sdk -G "Visual Studio 17 2022" -A x64 `
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF
          cmake --build build-vst3sdk --config Release --target validator

      - name: Validate VST3
        timeout-minutes: 10
        run: |
          $PSNativeCommandUseErrorActionPreference = $false # exit codes are checked below
          $out = & build-vst3sdk/bin/Release/validator.exe build/Release/YeOldeVST.vst3 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          $result = ($out -split "`n" | Where-Object { $_ -match '^Result:' } | Select-Object -Last 1)
          "### VST3 validator`n`n$result" >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0 -or $result -notmatch ' 0 tests failed') { throw "VST3 validator failed (exit $code)" }

      - name: Package
        id: package
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $name = "YeOldeVST-$v"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item build/Release/YeOldeVST.clap $dir
          Copy-Item build/Release/YeOldeVST.vst3 $dir -Recurse
          Copy-Item README.md, LICENSE, THIRD_PARTY_LICENSES.txt $dir
          (Get-Content packaging/INSTALL.txt -Raw).Replace('@VERSION@', $v) |
            Set-Content "$dir/INSTALL.txt" -NoNewline -Encoding ascii
          $zip = "dist/$name-win64.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "name=$name-win64" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.zip
          if-no-files-found: error

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false # exit codes are checked below
          $tag = $env:GITHUB_REF_NAME
          $v = "${{ steps.version.outputs.version }}"
          $zip = "${{ steps.package.outputs.zip }}"
          # The Linux job may create the draft at the same moment: retry a few times.
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            $draft = gh release view $tag --json isDraft -q .isDraft 2>$null
            if ($LASTEXITCODE -eq 0) {
              # Never replace the zip of a release that is already published.
              if ($draft -ne 'true') { throw "release $tag is already published" }
              gh release upload $tag $zip --clobber
            } else {
              gh release create $tag $zip --draft --verify-tag --title "YeOldeVST $v" --notes "YeOldeVST $v for Windows 64-bit and Linux x86_64."
            }
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 10
          }
          throw "could not attach $zip to $tag"

  # Linux: native Linux VST2 plugins (.so). Built on Ubuntu 22.04 so the result runs on glibc
  # 2.35 and newer (Ubuntu 22.04+, Debian 12+, Fedora 36+...).
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write # for attaching the tarball to a draft release on v* tags
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libx11-dev libgl-dev xvfb

      - name: Fetch submodules
        run: |
          git submodule update --init --depth 1 external/clap external/clap-wrapper external/vst3sdk
          git -C external/vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk cmake

      - name: Read version
        id: version
        run: |
          v=$(sed -n 's/^project(YeOldeVST VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [ -n "$v" ] || { echo "no version in CMakeLists.txt"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "tag $GITHUB_REF_NAME does not match CMakeLists.txt version $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "YeOldeVST $v"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test (headless CLAP host)
        timeout-minutes: 10
        run: |
          bin=$(realpath build)
          failed=0
          echo -e "### Headless CLAP host (Linux)\n\n| Case | Result |\n|---|---|" >> "$GITHUB_STEP_SUMMARY"
          run_case() {  # name, outputs ("" = the test plugin's default), args... (CHUNKS=1: settings as chunks)
            local name=$1 outs=$2; shift 2
            echo "::group::$name"
            out=$(YOV_TEST_OUTPUTS=$outs YOV_TEST_CHUNKS=${CHUNKS:-} xvfb-run -a "$bin/yov_clap_test" "$bin/YeOldeVST.clap" "$@" 2>&1); code=$?
            echo "$out"
            echo "::endgroup::"
            if [ $code -eq 0 ] && grep -q '^PASS' <<<"$out"; then r=PASS; else r="FAIL (exit $code)"; failed=$((failed + 1)); fi
            echo "$name: $r"
            echo "| $name | $r |" >> "$GITHUB_STEP_SUMMARY"
          }
          run_case "instrument, VST2 .so"   "" render instrument "$bin/YovTest64.so"
          run_case "effect, VST2 .so"       "" render effect "$bin/YovTest64.so"
          run_case "multi-out, VST2 .so"    "" render multi "$bin/YovTest64.so"
          run_case "128 outputs, VST2 .so"  128 render multi "$bin/YovTest64.so"
          CHUNKS=1 run_case "chunks, VST2 .so" "" render instrument "$bin/YovTest64.so"
          [ $failed -eq 0 ] || { echo "$failed test case(s) failed"; exit 1; }

      - name: Test MIDI controllers through the VST3
        timeout-minutes: 5
        run: |
          bin=$(realpath build)
          # Every CC, aftertouch and bend on every channel, sent the VST3 way (IMidiMapping).
          xvfb-run -a "$bin/yov_vst3_midi_test" "$bin/YeOldeVST.vst3/Contents/x86_64-linux/YeOldeVST.so" "$bin/YovTest64.so"

      - name: Build Steinberg VST3 validator
        run: |
          # The SDK's Linux sample hosts need these to configure, though only the validator is built
          # (the list from Steinberg's Linux setup notes).
          sudo apt-get install -y --no-install-recommends libgtkmm-3.0-dev libx11-xcb-dev libxcb-util-dev \
            libxcb-cursor-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libcairo2-dev libsqlite3-dev libxcb-keysyms1-dev
          cmake -S external/vst3sdk -B build-vst3sdk -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF
          cmake --build build-vst3sdk --target validator

      - name: Validate VST3
        timeout-minutes: 10
        run: |
          out=$(xvfb-run -a build-vst3sdk/bin/Release/validator build/Release/YeOldeVST.vst3 2>&1); code=$?
          echo "$out"
          result=$(grep '^Result:' <<<"$out" | tail -1)
          echo -e "### VST3 validator (Linux)\n\n$result" >> "$GITHUB_STEP_SUMMARY"
          [ $code -eq 0 ] && grep -q ' 0 tests failed' <<<"$result" || { echo "VST3 validator failed (exit $code)"; exit 1; }

      - name: Package
        id: package
        run: |
          v=${{ steps.version.outputs.version }}
          name=YeOldeVST-$v
          dir=dist/$name
          mkdir -p "$dir"
          cp build/YeOldeVST.clap "$dir/"
          cp -r build/Release/YeOldeVST.vst3 "$dir/"
          cp README.md LICENSE THIRD_PARTY_LICENSES.txt "$dir/"
          sed "s/@VERSION@/$v/" packaging/INSTALL-linux.txt > "$dir/INSTALL.txt"
          tarball=dist/$name-linux-x86_64.tar.gz
          tar -C dist -czf "$tarball" "$name"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "name=$name-linux-x86_64" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.tar.gz
          if-no-files-found: error

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          v=${{ steps.version.outputs.version }}
          file=${{ steps.package.outputs.tarball }}
          # The Windows job may create the draft at the same moment: retry a few times.
          for attempt in 1 2 3 4 5; do
            if draft=$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null); then
              # Never replace a file of a release that is already published.
              [ "$draft" = true ] || { echo "release $tag is already published"; exit 1; }
              gh release upload "$tag" "$file" --clobber && exit 0
            else
              gh release create "$tag" "$file" --draft --verify-tag --title "YeOldeVST $v" \
                --notes "YeOldeVST $v for Windows 64-bit and Linux x86_64." && exit 0
            fi
            sleep 10
          done
          echo "could not attach $file to $tag"; exit 1

  # macOS: YeOldeVST does not build on macOS yet. Once the port lands, remove `if: false`
  # (and the WIN32-only check in CMakeLists.txt) to get a universal build.
  macos:
    name: macOS universal
    if: false
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Fetch submodules
        run: |
          git submodule update --init --depth 1 external/clap external/clap-wrapper external/vst3sdk
          git -C external/vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk cmake

      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release

      # TODO: package YeOldeVST.clap / YeOldeVST.vst3 bundles as YeOldeVST-<version>-macos.zip,
      # upload as an artifact and attach to the draft release like the Windows job.
